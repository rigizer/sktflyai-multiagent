version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: dorandoran-multiagent
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
    container_name: dorandoran-frontend
    env_file:
      - .env
    environment:
      - VITE_API_BASE_URL=http://backend:8000
    depends_on:
      - backend
